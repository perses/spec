# Security updates (enable "Dependabot security updates" in the repository settings) are NOT grouped:
# Dependabot opens one dedicated PR per vulnerability so they can be reviewed and merged quickly.
# Version updates are grouped by semver update type (patch / minor / major).
version: 2
updates:
- package-ecosystem: "npm"
  directories:
  - "/ts"
  open-pull-requests-limit: 5
  schedule:
    interval: "monthly"
  groups:
    npm-patch:
      applies-to: version-updates
      update-types:
        - "patch"
    npm-minor:
      applies-to: version-updates
      update-types:
        - "minor"
    npm-major:
      applies-to: version-updates
      update-types:
        - "major"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    actions-patch:
      applies-to: version-updates
      update-types:
        - "patch"
    actions-minor:
      applies-to: version-updates
      update-types:
        - "minor"
    actions-major:
      applies-to: version-updates
      update-types:
        - "major"
- package-ecosystem: "gomod"
  directory: "/"
  open-pull-requests-limit: 10
  schedule:
    interval: "weekly"
  groups:
    gomod-patch:
      applies-to: version-updates
      update-types:
        - "patch"
    gomod-minor:
      applies-to: version-updates
      update-types:
        - "minor"
    gomod-major:
      applies-to: version-updates
      update-types:
        - "major"
- package-ecosystem: "maven"
  directory: "/java"
  open-pull-requests-limit: 10
  schedule:
    interval: "weekly"
  groups:
    maven-patch:
      applies-to: version-updates
      update-types:
        - "patch"
    maven-minor:
      applies-to: version-updates
      update-types:
        - "minor"
    maven-major:
      applies-to: version-updates
      update-types:
        - "major"

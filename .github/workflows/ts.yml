name: ts
on:
  push:
    branches:
      - main
      - release/*
      - snapshot/*
  pull_request:
  merge_group:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.12.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ts/.nvmrc"
      - name: install deps
        run: cd ./ts && pnpm install --frozen-lockfile
      - run: cd ./ts && pnpm lint
      - run: cd ./ts && pnpm format:check
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.12.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ts/.nvmrc"
      - name: install deps
        run: cd ./ts && pnpm install --frozen-lockfile
      - run: cd ./ts && pnpm test
  type_check:
    name: "type check"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.12.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ts/.nvmrc"
      - name: install deps
        run: cd ./ts && pnpm install --frozen-lockfile
      - run: cd ./ts && pnpm type-check
  build:
    name: "build"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.12.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ts/.nvmrc"
      - name: install dependencies
        run: cd ./ts && pnpm install --frozen-lockfile
      - name: build libraries
        run: cd ./ts && pnpm build
      - name: store libraries archives
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            ts/dist
            !ts/node_modules
  release:
    name: "release"
    needs: "build"
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC trusted publishing
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.12.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - uses: ./.github/perses-ci/actions/setup_environment
        with:
          enable_npm: true
          nvmrc_path: "./ts/.nvmrc"
      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: archives
          path: ts/dist
      - name: Dry run
        if: ${{ !github.event.release.tag_name }}
        run: |
          DIST_TAG=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo next || echo latest)
          cd ts && pnpm publish --no-git-checks --access public --dry-run --tag "${DIST_TAG}"
      - name: Publish npm package
        if: ${{ github.event.release.tag_name }}
        run: |
          DIST_TAG=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo next || echo latest)
          cd ts && pnpm publish --no-git-checks --access public --tag "${DIST_TAG}"

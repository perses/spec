name: ts
on:
  push:
    branches:
      - main
      - release/*
      - snapshot/*
  pull_request:
  merge_group:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_name != 'main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - name: install deps
        run: cd ./ts && pnpm install --frozen-lockfile
      - run: cd ./ts && pnpm run lint
      - run: cd ./ts && pnpm run format:check
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - name: install deps
        run: cd ./ts && pnpm install --frozen-lockfile
      - run: cd ./ts && pnpm run test
  type_check:
    name: "type check"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - name: install deps
        run: cd ./ts && pnpm install --frozen-lockfile
      - run: cd ./ts && pnpm run type-check
  build:
    name: 'build'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - name: install dependencies
        run: cd ./ts && pnpm install --frozen-lockfile
      - name: build libraries
        run: cd ./ts && pnpm run build
      - name: store libraries archives
        uses: actions/upload-artifact@v7
        with:
          name: archives
          path: |
            ts/dist
            !ts/node_modules
  release:
    name: 'release'
    needs: 'build'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - uses: perses/github-actions@v0.13.0
      - uses: pnpm/setup@v2.1.0
        with:
          working-directory: ./ts
          install: false
          cache: true
      - name: Download archive
        uses: actions/download-artifact@v8
        with:
          name: archives
          path: ts/dist
      - name: Dry run
        if: ${{ !github.event.release.tag_name }}
        working-directory: ts
        run: |
          pnpm pkg set private=true --json
          pnpm version prerelease \
            --preid="dry-run.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --no-git-tag-version \
            --no-git-checks \
            --ignore-scripts
          pnpm publish --no-git-checks --access public --dry-run --tag dry-run
      - name: Publish npm package
        if: ${{ github.event.release.tag_name }}
        run: |
          DIST_TAG=$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo next || echo latest)
          cd ts &&  pnpm publish --no-git-checks --access public --tag "${DIST_TAG}"
